<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Grupo Kuhn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }

:root {
  --bg:         #0f1117;
  --surface:    #171b24;
  --surface2:   #1e2330;
  --border:     #252c3a;
  --border2:    #2e3648;
  --text:       #e8ecf2;
  --muted:      #5a6580;
  --muted2:     #3d4760;
  --primary:    #4f8ef7;
  --success:    #22c55e;
  --warning:    #f59e0b;
  --danger:     #ef4444;
  --accent:     #a78bfa;
  --font:       'Space Grotesk', sans-serif;
  --mono:       'JetBrains Mono', monospace;
  --r:          10px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── LAYOUT ── */
.wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

/* ── HEADER ── */
header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
}
.brand p { font-size: .68rem; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: .12em; margin-bottom: .2rem; }
.brand h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.03em; }
.btn-refresh {
  display: flex; align-items: center; gap: .4rem;
  padding: .45rem .9rem;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--muted); font-family: var(--font);
  font-size: .75rem; font-weight: 500; cursor: pointer; transition: all .2s;
  white-space: nowrap; margin-top: .15rem;
}
.btn-refresh:hover { color: var(--text); border-color: var(--primary); }
.btn-refresh svg { width: 14px; height: 14px; }

/* ── STATUS ── */
.status {
  display: flex; align-items: center; gap: .5rem;
  font-size: .72rem; color: var(--muted);
  font-family: var(--mono);
  margin-bottom: 1.25rem;
  padding: .6rem .9rem;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px;
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted2); flex-shrink: 0; }
.status-dot.live { background: var(--success); animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:.4} }
.status-time { margin-left: auto; }

/* ── FILTERS ── */
.filters {
  position: sticky; top: 0; z-index: 20;
  display: flex; flex-wrap: wrap; gap: .4rem; align-items: center;
  padding: .6rem .75rem;
  background: rgba(15,17,23,.85);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 1.25rem;
}
.filters select, .filter-btn {
  height: 32px; padding: 0 .75rem;
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: 6px; color: var(--text);
  font-family: var(--font); font-size: .75rem;
  cursor: pointer; outline: none; appearance: none;
}
.filters select:focus, .filter-btn:hover { border-color: var(--primary); }
.filter-btn { display: flex; align-items: center; gap: .35rem; }
.period-label {
  margin-left: auto;
  font-family: var(--mono); font-size: .68rem; color: var(--muted);
}

/* ── TABS ── */
.tabs {
  display: flex; gap: .25rem; margin-bottom: 1.5rem;
  overflow-x: auto; padding-bottom: 2px;
}
.tab {
  padding: .5rem .85rem;
  border-radius: 8px;
  font-size: .78rem; font-weight: 500;
  color: var(--muted); cursor: pointer; border: none; background: transparent;
  white-space: nowrap; transition: all .15s;
}
.tab:hover { color: var(--text); background: var(--surface2); }
.tab.active { background: rgba(79,142,247,.15); color: var(--primary); }

/* ── SECTION HEADER ── */
.section-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: .75rem;
}
.section-head h2 { font-size: 1rem; font-weight: 600; }

/* ── KPI GRID ── */
.kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .6rem; margin-bottom: 1.25rem; }
@media(min-width:600px){ .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
.kpi {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: .9rem 1rem;
}
.kpi p:first-child { font-size: .62rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: .5rem; }
.kpi-val { font-family: var(--mono); font-size: 1.5rem; font-weight: 600; color: var(--text); letter-spacing: -.02em; }
.kpi-sub { font-size: .68rem; color: var(--muted); margin-top: .25rem; }
.kpi-sub .up   { color: var(--success); }
.kpi-sub .down { color: var(--danger); }

/* ── STORE GRID ── */
.store-grid { display: grid; grid-template-columns: repeat(1, 1fr); gap: .6rem; margin-bottom: 1.5rem; }
@media(min-width:480px){ .store-grid { grid-template-columns: repeat(2, 1fr); } }
@media(min-width:720px){ .store-grid { grid-template-columns: repeat(3, 1fr); } }

.store-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); padding: 1rem;
}
.store-top { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; margin-bottom: .35rem; }
.store-name { font-size: .85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.store-atend { font-family: var(--mono); font-size: .7rem; color: var(--muted); white-space: nowrap; }
.store-val { font-family: var(--mono); font-size: 1.15rem; font-weight: 600; margin-bottom: .75rem; }
.prog-wrap { }
.prog-bg { height: 6px; background: var(--surface2); border-radius: 999px; overflow: hidden; margin-bottom: .3rem; }
.prog-fill { height: 100%; border-radius: 999px; transition: width .6s ease; }
.prog-label { font-family: var(--mono); font-size: .65rem; color: var(--muted); }

/* ── SELLERS ── */
.sellers-list { display: flex; flex-direction: column; gap: .5rem; margin-bottom: 1.5rem; }
details.store-sellers {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
}
details.store-sellers summary {
  padding: .85rem 1rem;
  font-size: .85rem; font-weight: 600;
  cursor: pointer; list-style: none;
  display: flex; align-items: center; justify-content: space-between;
  user-select: none;
}
details.store-sellers summary::-webkit-details-marker { display: none; }
details.store-sellers summary::after {
  content: '▾'; font-size: .75rem; color: var(--muted); transition: transform .2s;
}
details.store-sellers[open] summary::after { transform: rotate(-180deg); }
.sellers-inner { padding: .25rem 1rem .85rem; display: flex; flex-direction: column; gap: .65rem; }
.seller-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .75rem; }
.seller-info .seller-name { font-size: .82rem; margin-bottom: .3rem; display: flex; align-items: center; gap: .4rem; }
.badge-gerente {
  font-size: .6rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
  color: var(--accent); padding: .1rem .35rem; border-radius: 4px;
  background: rgba(167,139,250,.1); border: 1px solid rgba(167,139,250,.25);
}
.seller-pct { font-family: var(--mono); font-size: .82rem; font-weight: 600; text-align: right; white-space: nowrap; }

/* ── LOADING/EMPTY ── */
.state-msg {
  text-align: center; padding: 3rem 1rem;
  font-size: .85rem; color: var(--muted);
}
.spinner {
  width: 24px; height: 24px; border: 2px solid var(--border2);
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin .7s linear infinite; margin: 0 auto .75rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── TAB PANELS ── */
.panel { display: none; }
.panel.active { display: block; }

/* ── COLORS ── */
.c-success { color: var(--success); }
.c-warning { color: var(--warning); }
.c-danger  { color: var(--danger); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <p>Rede de óticas</p>
      <h1>Painel de gestão</h1>
    </div>
    <button class="btn-refresh" id="btn-refresh" onclick="loadData()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      Atualizar
    </button>
  </header>

  <div class="status">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Carregando...</span>
    <span class="status-time" id="status-time"></span>
  </div>

  <div class="filters">
    <select id="filter-bandeira" onchange="renderAll()">
      <option value="ambas">Ambas as bandeiras</option>
      <option value="otica">Ótica</option>
      <option value="vermelha">Vermelha</option>
    </select>
    <select id="filter-gerente" onchange="renderAll()">
      <option value="sim">Com gerente</option>
      <option value="nao">Sem gerente</option>
    </select>
    <span class="period-label" id="period-label"></span>
  </div>

  <nav class="tabs">
    <button class="tab active" onclick="switchTab('hoje', this)">Ao Vivo</button>
    <button class="tab" onclick="switchTab('ranking', this)">Ranking</button>
    <button class="tab" onclick="switchTab('lojas', this)">Lojas</button>
    <button class="tab" onclick="switchTab('vendedores', this)">Vendedores</button>
  </nav>

  <!-- ══ HOJE ══ -->
  <div class="panel active" id="panel-hoje">
    <div id="hoje-content">
      <div class="state-msg"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>

  <!-- ══ RANKING ══ -->
  <div class="panel" id="panel-ranking">
    <div id="ranking-content">
      <div class="state-msg"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>

  <!-- ══ LOJAS ══ -->
  <div class="panel" id="panel-lojas">
    <div id="lojas-content">
      <div class="state-msg"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>

  <!-- ══ VENDEDORES ══ -->
  <div class="panel" id="panel-vendedores">
    <div id="vendedores-content">
      <div class="state-msg"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>

</div>

<script>
// ════════════════════════════════════
// CONFIG
// ════════════════════════════════════
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx0e912mcCxsM2roJSsU4tqVzJzYEGvzHyakRK8CWyHDdcF_GbFkV0Mu0e2Wvsy0quF/exec";

// Mapeamento de loja para bandeira
const BANDEIRA = {
  "ATM":      "vermelha",
  "PBA LJR":  "vermelha",
  "PBA SHOP": "vermelha",
  "TAPAJÓS":  "vermelha",
  "PARAÍSO":  "vermelha",
  "OTC PBA":  "otica",
  "OTC TPJ":  "otica",
};

// Nomes amigáveis
const NOME_LOJA = {
  "ATM":      "Altamira",
  "PBA LJR":  "Parauapebas LJR",
  "PBA SHOP": "Parauapebas Shop",
  "TAPAJÓS":  "Tapajós",
  "PARAÍSO":  "Paraíso",
  "OTC PBA":  "Ótica Parauapebas",
  "OTC TPJ":  "Ótica Tapajós",
};

// ════════════════════════════════════
// ESTADO GLOBAL
// ════════════════════════════════════
let dadosHoje = [];       // indicadores_hoje
let dadosD1   = [];       // indicadores D-1
let lojasMapa = {};       // vendedor → loja
let metaDiaria = {};      // loja → meta do dia (vem da planilha Curva)
let curvaData  = [];      // curva de venda
let lastUpdate = null;

// ════════════════════════════════════
// LOAD
// ════════════════════════════════════
function loadData() {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true; btn.textContent = '⏳ Buscando...';
  setStatus('Buscando dados...', false);

  fetch(APPS_SCRIPT_URL, { redirect: 'follow', cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(json => {
      processarDados(json);
      lastUpdate = new Date();
      setStatus('Atualizado', true);
      document.getElementById('status-time').textContent =
        'última leitura ' + lastUpdate.toLocaleTimeString('pt-BR');
      renderAll();
    })
    .catch(err => {
      setStatus('Erro: ' + err.message, false);
    })
    .finally(() => {
      btn.disabled = false;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg> Atualizar';
    });
}

function processarDados(json) {
  // ── Mapa vendedor → loja ──
  lojasMapa = {};
  if (json.lojas && json.lojas.length) {
    let lojaAtual = '';
    json.lojas.forEach(row => {
      const val = String(row[0] || '').trim();
      if (!val) return;
      if (!/\(/.test(val)) { lojaAtual = val; }
      else { lojasMapa[val] = lojaAtual; }
    });
  }

  const parseIndicadores = (rows) => {
    if (!rows || rows.length < 2) return [];
    const hdr = rows[0].map(h => String(h).trim().toLowerCase()
      .replace(/[\s\.]/g,'').replace('qtde','').replace('peças','pecas')
      .replace('vl','valor').replace('médio','medio'));
    return rows.slice(1).map(r => {
      const o = {}; hdr.forEach((h,i) => o[h] = r[i]);
      const nome = String(o['vendedor'] || o[hdr[1]] || '');
      const loja = lojasMapa[nome] || '—';
      const isGerente = /^GERENTE\s/i.test(nome.replace(/\s*\(\d+\)$/,''));
      return {
        nome,
        nomeCurto: nome.replace(/\s*\(\d+\)$/,'').replace(/^GERENTE\s+/i,''),
        loja,
        bandeira: BANDEIRA[loja] || 'vermelha',
        isGerente,
        pecas:  parseFloat(o['pecas']  || o[hdr[2]] || 0),
        vendas: parseFloat(o['vendas'] || o[hdr[3]] || 0),
        ppv:    parseFloat(o['pecasvenda'] || o[hdr[4]] || 0),
        valor:  parseFloat(o['valorvendas'] || o[hdr[5]] || 0),
        ticket: parseFloat(o['ticketmedio'] || o[hdr[6]] || 0),
      };
    }).filter(d => d.nome && d.valor >= 0);
  };

  dadosHoje = parseIndicadores(json.indicadores_hoje);
  dadosD1   = parseIndicadores(json.indicadores);

  // ── Meta diária da curva ──
  metaDiaria = {};
  curvaData  = json.curva || [];
  if (curvaData.length > 1) {
    const hoje = new Date();
    const lbl  = String(hoje.getDate()).padStart(2,'0') + '/' + String(hoje.getMonth()+1).padStart(2,'0');
    const LOJA_IDX = {0:'ATM',1:'PBA LJR',2:'PBA SHOP',3:'TAPAJÓS',4:'PARAÍSO',5:'OTC PBA',6:'OTC TPJ'};
    curvaData.slice(1).forEach(row => {
      if (String(row[0]||'').trim() === lbl) {
        Object.entries(LOJA_IDX).forEach(([ci, loja]) => {
          const v = parseFloat(String(row[+ci+1]||'0').replace(/[R$\s.]/g,'').replace(',','.'));
          if (!isNaN(v) && v > 0) metaDiaria[loja] = v;
        });
      }
    });
  }

  // Período
  const hoje = new Date();
  document.getElementById('period-label').textContent =
    '01/' + String(hoje.getMonth()+1).padStart(2,'0') + '/' + hoje.getFullYear() +
    ' — ' + String(hoje.getDate()).padStart(2,'0') + '/' + String(hoje.getMonth()+1).padStart(2,'0') + '/' + hoje.getFullYear();
}

// ════════════════════════════════════
// FILTROS
// ════════════════════════════════════
function filtrar(dados) {
  const band   = document.getElementById('filter-bandeira').value;
  const gerente = document.getElementById('filter-gerente').value;
  return dados.filter(d => {
    if (band !== 'ambas' && d.bandeira !== band) return false;
    if (gerente === 'nao' && d.isGerente) return false;
    return true;
  });
}

function lojasVisiveis() {
  const band = document.getElementById('filter-bandeira').value;
  return Object.entries(BANDEIRA)
    .filter(([,b]) => band === 'ambas' || b === band)
    .map(([l]) => l);
}

// ════════════════════════════════════
// HELPERS
// ════════════════════════════════════
const fmtR = v => 'R$\u00a0' + parseFloat(v||0).toLocaleString('pt-BR', {minimumFractionDigits:0, maximumFractionDigits:0});
const fmtR2 = v => 'R$\u00a0' + parseFloat(v||0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});

function corProg(pct) {
  if (pct >= 100) return 'var(--success)';
  if (pct >= 70)  return 'var(--warning)';
  return 'var(--danger)';
}

function progBar(val, meta, label) {
  const pct  = meta > 0 ? Math.min((val/meta)*100, 100) : 0;
  const cor  = corProg(meta > 0 ? (val/meta)*100 : 0);
  const pctDisplay = meta > 0 ? Math.round((val/meta)*100) : 0;
  return `
    <div class="prog-bg"><div class="prog-fill" style="width:${pct}%;background:${cor}"></div></div>
    <p class="prog-label">${label || (fmtR(val) + ' / ' + fmtR(meta) + ' · ' + pctDisplay + '%')}</p>`;
}

function agruparPorLoja(dados) {
  const map = {};
  dados.forEach(d => {
    if (!map[d.loja]) map[d.loja] = { loja: d.loja, valor: 0, atendimentos: 0, vendedores: [] };
    map[d.loja].valor        += d.valor;
    map[d.loja].atendimentos += d.vendas;
    map[d.loja].vendedores.push(d);
  });
  return map;
}

// ════════════════════════════════════
// RENDER HOJE
// ════════════════════════════════════
function renderHoje() {
  const dados = filtrar(dadosHoje);
  const lojas = lojasVisiveis();
  const por   = agruparPorLoja(dados);

  const totalVal  = dados.reduce((s,d) => s+d.valor, 0);
  const totalMeta = lojas.reduce((s,l) => s+(metaDiaria[l]||0), 0);
  const totalAtend = dados.reduce((s,d) => s+d.vendas, 0);
  const mesmoAnoPass = null; // virá da base ano anterior futuramente

  const pctMeta = totalMeta > 0 ? Math.round((totalVal/totalMeta)*100) : 0;

  // KPIs
  let html = `<div class="kpi-grid">
    <div class="kpi">
      <p>Faturamento do dia</p>
      <div class="kpi-val">${fmtR(totalVal)}</div>
    </div>
    <div class="kpi">
      <p>Meta do dia</p>
      <div class="kpi-val">${fmtR(totalMeta)}</div>
      <div class="kpi-sub">Atingimento ${pctMeta}%</div>
    </div>
    <div class="kpi">
      <p>Atendimentos</p>
      <div class="kpi-val">${totalAtend}</div>
    </div>
    <div class="kpi">
      <p>Ticket médio</p>
      <div class="kpi-val">${totalAtend > 0 ? fmtR(totalVal/totalAtend) : '—'}</div>
    </div>
  </div>`;

  // Lojas hoje
  html += `<div class="section-head"><h2>Lojas hoje</h2></div>
  <div class="store-grid">`;

  lojas.forEach(loja => {
    const d    = por[loja] || { valor: 0, atendimentos: 0 };
    const meta = metaDiaria[loja] || 0;
    const pct  = meta > 0 ? Math.round((d.valor/meta)*100) : 0;
    const cor  = corProg(pct);
    html += `
    <div class="store-card">
      <div class="store-top">
        <span class="store-name">${NOME_LOJA[loja] || loja}</span>
        <span class="store-atend">${d.atendimentos} at.</span>
      </div>
      <div class="store-val">${fmtR(d.valor)}</div>
      ${meta > 0 ? progBar(d.valor, meta) : '<p class="prog-label" style="color:var(--muted2)">Sem meta cadastrada</p>'}
    </div>`;
  });
  html += `</div>`;

  // Vendedores hoje
  html += `<div class="section-head"><h2>Vendedores hoje</h2></div>
  <div class="sellers-list">`;

  lojas.forEach(loja => {
    const vends = (por[loja]?.vendedores || [])
      .filter(d => document.getElementById('filter-gerente').value === 'sim' || !d.isGerente)
      .sort((a,b) => b.valor - a.valor);
    if (!vends.length) return;

    // Meta por vendedor = meta da loja / nº vendedores ativos (excluindo gerentes)
    const nVendsAtivos = vends.filter(v => !v.isGerente).length || 1;
    const metaLoja = metaDiaria[loja] || 0;
    const metaVend = metaLoja / nVendsAtivos;
    const metaGerente = metaLoja * 1.385 / nVendsAtivos; // gerente tem meta maior (aprox)

    html += `<details class="store-sellers" open>
      <summary>${NOME_LOJA[loja] || loja}</summary>
      <div class="sellers-inner">`;

    vends.forEach(v => {
      const meta = v.isGerente ? metaGerente : metaVend;
      const pct  = meta > 0 ? Math.round((v.valor/meta)*100) : 0;
      const cor  = corProg(pct);
      const pctCls = pct >= 100 ? 'c-success' : pct >= 70 ? 'c-warning' : 'c-danger';
      html += `
        <div class="seller-row">
          <div class="seller-info">
            <div class="seller-name">
              ${v.nomeCurto}
              ${v.isGerente ? '<span class="badge-gerente">gerente</span>' : ''}
            </div>
            <div class="prog-bg" style="margin-bottom:.25rem">
              <div class="prog-fill" style="width:${Math.min(pct,100)}%;background:${cor}"></div>
            </div>
            <p class="prog-label">${fmtR(v.valor)}${meta > 0 ? ' / ' + fmtR(meta) + ' · ' + pct + '%' : ''}</p>
          </div>
          <div class="seller-pct ${pctCls}">${pct}%</div>
        </div>`;
    });

    html += `</div></details>`;
  });

  html += `</div>`;

  document.getElementById('hoje-content').innerHTML = html || '<div class="state-msg">Sem dados para hoje.</div>';
}

// ════════════════════════════════════
// RENDER RANKING
// ════════════════════════════════════
function renderRanking() {
  const dados = filtrar(dadosHoje).sort((a,b) => b.valor - a.valor);
  if (!dados.length) {
    document.getElementById('ranking-content').innerHTML = '<div class="state-msg">Sem dados.</div>';
    return;
  }
  const maxVal = dados[0].valor;

  let html = `<div class="section-head"><h2>Ranking — Hoje</h2></div>
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
    <table style="width:100%;border-collapse:collapse">
      <thead>
        <tr style="border-bottom:1px solid var(--border2)">
          <th style="padding:.55rem .9rem;text-align:left;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">#</th>
          <th style="padding:.55rem .9rem;text-align:left;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">Vendedor</th>
          <th style="padding:.55rem .9rem;text-align:left;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">Loja</th>
          <th style="padding:.55rem .9rem;text-align:right;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">PA</th>
          <th style="padding:.55rem .9rem;text-align:right;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">TM</th>
          <th style="padding:.55rem .9rem;text-align:right;font-size:.62rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)">Total</th>
        </tr>
      </thead>
      <tbody>`;

  dados.forEach((d, i) => {
    const medal = i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1);
    const pct = maxVal > 0 ? Math.round((d.valor/maxVal)*100) : 0;
    html += `
      <tr style="border-bottom:1px solid var(--border2)">
        <td style="padding:.6rem .9rem;font-family:var(--mono);font-size:.78rem;color:var(--muted)">${medal}</td>
        <td style="padding:.6rem .9rem">
          <div style="font-size:.82rem;font-weight:500;margin-bottom:.25rem">${d.nomeCurto}${d.isGerente?'<span class="badge-gerente" style="margin-left:.35rem">gerente</span>':''}</div>
          <div class="prog-bg" style="max-width:140px"><div class="prog-fill" style="width:${pct}%;background:var(--primary)"></div></div>
        </td>
        <td style="padding:.6rem .9rem;font-size:.75rem;color:var(--muted)">${NOME_LOJA[d.loja]||d.loja}</td>
        <td style="padding:.6rem .9rem;font-family:var(--mono);font-size:.78rem;text-align:right">${parseFloat(d.ppv||0).toFixed(1)}</td>
        <td style="padding:.6rem .9rem;font-family:var(--mono);font-size:.78rem;text-align:right;color:var(--muted)">${fmtR(d.ticket)}</td>
        <td style="padding:.6rem .9rem;font-family:var(--mono);font-size:.85rem;font-weight:600;text-align:right;color:var(--primary)">${fmtR(d.valor)}</td>
      </tr>`;
  });
  html += `</tbody></table></div>`;

  document.getElementById('ranking-content').innerHTML = html;
}

// ════════════════════════════════════
// RENDER LOJAS
// ════════════════════════════════════
function renderLojas() {
  const dados = filtrar(dadosHoje);
  const lojas = lojasVisiveis();
  const por   = agruparPorLoja(dados);

  let html = `<div class="section-head"><h2>Diagnóstico das lojas</h2></div>
  <div class="store-grid">`;

  lojas.forEach(loja => {
    const d    = por[loja] || { valor: 0, atendimentos: 0, vendedores: [] };
    const meta = metaDiaria[loja] || 0;
    const pct  = meta > 0 ? Math.round((d.valor/meta)*100) : 0;
    const tm   = d.atendimentos > 0 ? d.valor/d.atendimentos : 0;
    const pa   = d.vendedores.reduce((s,v) => s+v.pecas, 0) / (d.atendimentos||1);
    html += `
    <div class="store-card">
      <div class="store-top">
        <span class="store-name">${NOME_LOJA[loja]||loja}</span>
        <span class="store-atend">${d.atendimentos} at.</span>
      </div>
      <div class="store-val">${fmtR(d.valor)}</div>
      ${meta > 0 ? progBar(d.valor, meta) : '<p class="prog-label" style="color:var(--muted2)">Sem meta</p>'}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.75rem;padding-top:.6rem;border-top:1px solid var(--border)">
        <div>
          <p style="font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.15rem">TM</p>
          <p style="font-family:var(--mono);font-size:.82rem;font-weight:500">${fmtR(tm)}</p>
        </div>
        <div>
          <p style="font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.15rem">PA</p>
          <p style="font-family:var(--mono);font-size:.82rem;font-weight:500">${pa.toFixed(1)}</p>
        </div>
        <div>
          <p style="font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.15rem">Vendedores</p>
          <p style="font-family:var(--mono);font-size:.82rem;font-weight:500">${d.vendedores.filter(v=>!v.isGerente).length}</p>
        </div>
        <div>
          <p style="font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:.15rem">Ating.</p>
          <p style="font-family:var(--mono);font-size:.82rem;font-weight:500;color:${corProg(pct)}">${meta>0?pct+'%':'—'}</p>
        </div>
      </div>
    </div>`;
  });

  html += `</div>`;
  document.getElementById('lojas-content').innerHTML = html;
}

// ════════════════════════════════════
// RENDER VENDEDORES
// ════════════════════════════════════
function renderVendedores() {
  const dados = filtrar(dadosHoje);
  const lojas = lojasVisiveis();
  const por   = agruparPorLoja(dados);

  let html = `<div class="section-head"><h2>Diagnóstico dos vendedores</h2></div>
  <div class="sellers-list">`;

  lojas.forEach(loja => {
    const vends = (por[loja]?.vendedores || []).sort((a,b) => b.valor - a.valor);
    if (!vends.length) return;

    const nAtivos = vends.filter(v => !v.isGerente).length || 1;
    const metaLoja = metaDiaria[loja] || 0;
    const metaVend = metaLoja / nAtivos;

    html += `<details class="store-sellers" open>
      <summary>${NOME_LOJA[loja]||loja}</summary>
      <div class="sellers-inner">
        <table style="width:100%;border-collapse:collapse">
          <thead><tr>
            <th style="text-align:left;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:.3rem 0;border-bottom:1px solid var(--border2)">Vendedor</th>
            <th style="text-align:right;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:.3rem 0;border-bottom:1px solid var(--border2)">Peças</th>
            <th style="text-align:right;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:.3rem 0;border-bottom:1px solid var(--border2)">PA</th>
            <th style="text-align:right;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:.3rem 0;border-bottom:1px solid var(--border2)">TM</th>
            <th style="text-align:right;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;padding:.3rem 0;border-bottom:1px solid var(--border2)">Total</th>
          </tr></thead>
          <tbody>`;

    vends.forEach(v => {
      if (document.getElementById('filter-gerente').value === 'nao' && v.isGerente) return;
      const meta = v.isGerente ? metaVend * 1.385 : metaVend;
      const pct  = meta > 0 ? Math.round((v.valor/meta)*100) : 0;
      const cor  = corProg(pct);
      html += `<tr style="border-bottom:1px solid var(--border2)">
        <td style="padding:.55rem 0;font-size:.8rem">
          ${v.nomeCurto}
          ${v.isGerente ? '<span class="badge-gerente">gerente</span>' : ''}
          <div class="prog-bg" style="margin-top:.25rem">
            <div class="prog-fill" style="width:${Math.min(pct,100)}%;background:${cor}"></div>
          </div>
        </td>
        <td style="padding:.55rem 0;font-family:var(--mono);font-size:.75rem;text-align:right;color:var(--muted)">${v.pecas}</td>
        <td style="padding:.55rem 0;font-family:var(--mono);font-size:.75rem;text-align:right;color:var(--muted)">${parseFloat(v.ppv||0).toFixed(1)}</td>
        <td style="padding:.55rem 0;font-family:var(--mono);font-size:.75rem;text-align:right;color:var(--muted)">${fmtR(v.ticket)}</td>
        <td style="padding:.55rem 0;font-family:var(--mono);font-size:.82rem;text-align:right;font-weight:600;color:${cor}">${pct}%<br><span style="font-size:.7rem;color:var(--muted)">${fmtR(v.valor)}</span></td>
      </tr>`;
    });

    html += `</tbody></table></div></details>`;
  });

  html += `</div>`;
  document.getElementById('vendedores-content').innerHTML = html;
}

// ════════════════════════════════════
// TABS & RENDER
// ════════════════════════════════════
const PANELS = ['hoje','ranking','lojas','vendedores'];
function switchTab(id, btn) {
  PANELS.forEach(p => {
    document.getElementById('panel-' + p).classList.toggle('active', p === id);
  });
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTab(id);
}

function renderTab(id) {
  if (id === 'hoje')       renderHoje();
  if (id === 'ranking')    renderRanking();
  if (id === 'lojas')      renderLojas();
  if (id === 'vendedores') renderVendedores();
}

function renderAll() {
  const active = document.querySelector('.tab.active');
  const id = active ? active.textContent.trim().toLowerCase()
    .replace('ao vivo','hoje').replace('diagnóstico das lojas','lojas')
    .replace('diagnóstico dos vendedores','vendedores') : 'hoje';
  renderTab(id === 'hoje' ? 'hoje' : id);
}

function setStatus(msg, live) {
  document.getElementById('status-text').textContent = msg;
  const dot = document.getElementById('status-dot');
  dot.classList.toggle('live', live);
}

// ── Auto-refresh a cada 2 minutos ──
setInterval(loadData, 2 * 60 * 1000);

// ── Init ──
loadData();
</script>
</body>
</html>
